<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar prévia · RotaFrota</title><style>body{font:18px system-ui;line-height:1.7;max-width:620px;margin:60px auto;padding:24px;color:#234735}button,a{display:inline-block;padding:16px 24px;background:#234735;color:white;border:0;border-radius:10px;font:inherit}p{margin-bottom:24px}</style></head><body><h1>Recuperar a prévia local</h1><p>Este recurso remove somente o registro do service worker que atende a esta prévia local. Não apaga viagens, fotos ou dados do navegador.</p><button id="recover">Reabrir a prévia atualizada</button><p id="status" role="status"></p><script>document.getElementById('recover').onclick=async()=>{if(!['localhost','127.0.0.1'].includes(location.hostname)){document.getElementById('status').textContent='Disponível somente na prévia local.';return;}const current=await navigator.serviceWorker?.getRegistration(location.href);if(current)await current.unregister();document.getElementById('status').textContent='Prévia liberada. Reabra o aplicativo.';location.replace('./?preview='+Date.now());};</script></body></html>
